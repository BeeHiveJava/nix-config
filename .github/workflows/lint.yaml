---
name: lint

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  editorconfig-checker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Run editorconfig-checker
      uses: editorconfig-checker/action-editorconfig-checker@v3.0.0

  yamllint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Run yamllint
      uses: karancode/yamllint-github-action@v3.0.0
      with:
        yamllint_config_filepath: .yamllint.yaml

  nix-flake-checker:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install nix
      uses: cachix/install-nix-action@v31

    - name: Run nix-flake-checker
      uses: DeterminateSystems/flake-checker-action@v13

    - name: Run nix flake check
      run: nix flake check --all-systems
